[package]
name = "paper-cli"
version = "0.1.0"
edition = "2024"
description = "Agent-friendly command-line client for Paper Desktop's MCP server"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "paper"
path = "src/main.rs"
